<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
        <legend>Personal information:</legend>
        <input type="text" id="firstname" name="firstname" placeholder="John" value="John" readonly><br><br>
        <label for="lastname">Lastname:</label><br>
        <input type="text" id="lastname" name="lastname" placeholder="Doe" disabled><br><br>
        <label for="email">Email:</label><br><br>
        <input type="email" id="Email" name="email" placeholder="johndoe@example.com" required><br><br>
        <label for="password">Password:</label><br><br>
        <input type="password" id="password" name="password" placeholder="******" size="40" required><br><br>
        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>
        <label>Hobbies:</label><br>
        <input type="checkbox" id="gaming" name="gaming" value="gaming">
        <label for="gaming">Gaming</label><br>
        <input type="checkbox" id="football" name="football" value="football">
        <label for="football">Football</label><br>
        <input type="checkbox" id="swimming" name="swimming" value="swimming">
        <label for="swimming">Swimming</label><br><br>
        <select name="pet" id="pet">
             <option value="dog">Dog</option>
             <option value="cat">Cat</option>
             <option value="parrot">Parrot</option>
       </select><br><br>
       <textarea name="message" rows="10" cols="30" maxlength="50"></textarea><br><br>
       <input type="sumbit" id="sumbit" name="sumbit"><br>
    </fieldset> 
  </form>
</body>

</html>
